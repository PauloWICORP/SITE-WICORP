{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block corpo %}
<div class="login">
  <h1>Wicorp <span>painel</span></h1>

  {% if sem_config %}
    <div class="aviso aviso--erro">
      Nenhuma senha cadastrada ainda. No servidor, rode:
      <code>python3 painel/criar-senha.py</code>
    </div>
  {% else %}
    <p class="sub">Área restrita. Aqui se publicam as novidades do site.</p>
    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" required autofocus autocomplete="username">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="current-password">
      <button type="submit" class="btn btn--primario">Entrar</button>
    </form>
  {% endif %}
</div>
{% endblock %}
